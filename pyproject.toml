[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quicksilverpro"
version = "0.4.0"
description = "CLI for QuickSilver Pro — one OpenAI-compatible API for Claude, GPT, Gemini, Grok, GLM, DeepSeek, Qwen, Kimi and Muse chat plus FLUX image generation, on a single balance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MachineFi Inc.", email = "hello@quicksilverpro.io" }]
keywords = [
  "openai", "claude", "anthropic", "gpt", "gemini", "deepseek", "qwen",
  "kimi", "muse", "flux", "llm", "inference", "api", "chatgpt", "ai", "cli",
  "coding-agent", "image-generation", "text-to-image",
  "openrouter-alternative", "quicksilverpro", "grok", "glm", "nemotron",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.25",
  "rich>=13",
]

[project.urls]
Homepage     = "https://quicksilverpro.io"
Documentation = "https://quicksilverpro.io/dashboard#quickstart"
Repository   = "https://github.com/machinefi/qspro-cli"
Issues       = "https://github.com/machinefi/qspro-cli/issues"
Status       = "https://quicksilverpro.io/status"

[project.scripts]
qsp = "quicksilverpro.cli:run"
quicksilverpro = "quicksilverpro.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/quicksilverpro"]
